<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cari Indeks Al-Qur'an</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 p-4 md:p-8 text-sm text-gray-700">
    <div class="max-w-2xl mx-auto bg-white p-6 rounded-xl shadow-xs border border-gray-200">
        <h1 class="text-xl font-bold text-emerald-700 mb-1">Cari Indeks Al-Qur'an</h1>
        <p class="text-gray-400 mb-4 text-xs">Ketik nomor (1-114) melihat jumlah ayat, juz, dan halamannya.</p>

        <!-- Form Pencarian -->
        <div class="flex gap-2 mb-2">
            <input id="input" type="text" placeholder="Contoh: 10" class="flex-1 border border-gray-300 rounded-lg px-3 py-1.5 focus:outline-none focus:border-emerald-600" list="list">
            <datalist id="list"></datalist>
            <button onclick="cari()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-1.5 rounded-lg font-medium cursor-pointer">Cari</button>
        </div>
        <p id="error" class="text-red-500 text-xs hidden mb-4"></p>

        <!-- Komponen Riwayat Pencarian -->
        <div class="text-xs text-gray-400 flex flex-wrap gap-2 items-center mb-6">
            <span>Riwayat:</span>
            <div id="history" class="flex flex-wrap gap-1.5 items-center"></div>
            <button id="clear-all" onclick="hapusSemuaRiwayat()" class="text-red-500 hover:underline ml-auto hidden cursor-pointer text-[11px]">Hapus Semua</button>
        </div>

        <!-- Tabel Hasil -->
        <div id="result" class="hidden border border-gray-200 rounded-lg overflow-hidden">
            <table class="w-full text-center border-collapse">
                <thead class="bg-gray-50 text-xs uppercase text-gray-500 border-b border-gray-200">
                    <tr>
                        <th class="p-3 text-left">Nama Surat</th>
                        <th class="p-3">Ayat</th>
                        <th class="p-3">Juz</th>
                        <th class="p-3">Halaman</th>
                    </tr>
                </thead>
                <tbody id="tbody" class="divide-y divide-gray-100 bg-white font-medium text-gray-800"></tbody>
            </table>
        </div>
    </div>

    <script src="main.js">
    </script>
</body>
</html>
